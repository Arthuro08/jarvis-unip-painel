  <title>Jarvis UNIP — Assistente Acadêmico</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #151f32;
      --card-hover: #1e293b;
      --border: #26354d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --urgent: #ef4444;
      --urgent-bg: rgba(239, 68, 68, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --ok: #10b981;
      --ok-bg: rgba(16, 185, 129, 0.14);
      --neutral: #64748b;
      --neutral-bg: rgba(100, 116, 139, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }
    .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    .brand p { font-size: 11px; color: var(--muted); }
    .sync-pill {
      font-size: 11px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 14px 14px 24px; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .kpi:active { transform: scale(0.97); }
    .kpi.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .kpi-num { font-size: 20px; font-weight: 800; line-height: 1.1; }
    .kpi-label { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .search-bar {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 36px 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .search-bar:focus { border-color: var(--accent); }
    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--muted);
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-search.visible { display: inline-flex; }
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .clickable-card { cursor: pointer; }
    .clickable-card:hover { border-color: rgba(56, 189, 248, 0.45); }
    .card-urgent { border-left: 4px solid var(--urgent); }
    .card-warn { border-left: 4px solid var(--warn); }
    .card-ok { border-left: 4px solid var(--ok); }
    .card-neutral { border-left: 4px solid var(--neutral); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-urgent { background: var(--urgent-bg); color: #fca5a5; }
    .badge-warn { background: var(--warn-bg); color: #fcd34d; }
    .badge-ok { background: var(--ok-bg); color: #6ee7b7; }
    .badge-neutral { background: var(--neutral-bg); color: #cbd5e1; }
    .assign-id {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .course-tag {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .task-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--card-hover);
      color: var(--text);
      cursor: pointer;

    .btn-primary {

      border-color: rgba(56, 189, 248, 0.35);
      color: var(--accent);

      padding: 32px 16px;

      font-size: 14px;
    }

      <div id="cursos-list"></div>
    </section>

    <!-- TAB 3: NOTAS -->
    <section id="tab-notas" class="tab-panel">
      <div id="notas-list"></div>
    </section>

    <!-- TAB 4: ENTREGUES -->
    <section id="tab-entregues" class="tab-panel">
      <div id="entregues-list"></div>
    </section>
  </main>

77-dt-content-rid-3514125_1/xid-3514125_1"}]}]};

    let currentFilter = 'foco';

    function calcLiveStatus(t) {
      if (t.entregue) {
        return { cls: 'ok', label: '✅ Entregue', category: 'entregue' };
      }
      if (!t.duedate || t.duedate <= 0) {
        return { cls: 'neutral', label: '⚪ Sem prazo', category: 'sem_prazo' };
      }
      const now = Date.now() / 1000;
      const delta = t.duedate - now;
      if (delta < 0) {
        const days = Math.floor(Math.abs(delta) / 86400);
        if (t.canedit !== false) {
          return { cls: 'warn', label: `🔓 Atrasada (${days}d atrás - Aberta)`, category: 'atrasada_aberta' };
        }
        return { cls: 'neutral', label: `⚫ Encerrada (${days}d atrás)`, category: 'encerrada' };
      } else if (delta <= 48 * 3600) {
        const hours = Math.max(1, Math.floor(delta / 3600));
        return { cls: 'urgent', label: `🔴 URGENTE (${hours}h restantes)`, category: 'urgente' };
      } else if (delta <= 7 * 86400) {
        const days = Math.max(1, Math.floor(delta / 86400));
        return { cls: 'warn', label: `🟡 Esta Semana (${days}d restantes)`, category: 'semana' };
      } else {
        const days = Math.floor(delta / 86400);
        return { cls: 'ok', label: `🟢 No Prazo (${days}d restantes)`, category: 'no_prazo' };
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function updateKPIs() {
      if (DATA.aluno && DATA.aluno.nome) {
        document.getElementById('student-info').textContent = `${DATA.aluno.nome} • ${DATA.aluno.curso}`;
      }
      document.getElementById('sync-time').textContent = 'Sync: ' + (DATA.ultima_sincronizacao || '');
      let urgent7d = 0, onTime = 0, openLate = 0, done = 0;
      for (const t of DATA.todas_tarefas) {
        const st = calcLiveStatus(t);
        if (st.category === 'entregue') done++;
        else if (st.category === 'urgente' || st.category === 'semana') urgent7d++;
        else if (st.category === 'no_prazo') onTime++;
        else if (st.category === 'atrasada_aberta') openLate++;
      }
      document.getElementById('kpi-urgent').textContent = urgent7d;
      document.getElementById('kpi-ontime').textContent = onTime;
      document.getElementById('kpi-openlate').textContent = openLate;
      document.getElementById('kpi-done').textContent = done;
    }

    function syncActiveStates() {
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.dataset.filter === currentFilter);
      });
      const kpiUrgent = document.getElementById('kpi-card-urgent');
      const kpiOntime = document.getElementById('kpi-card-ontime');
      const kpiOpenlate = document.getElementById('kpi-card-openlate');
      if (kpiUrgent) kpiUrgent.classList.toggle('active', currentFilter === 'urgentes_7d' || currentFilter === 'foco');
      if (kpiOntime) kpiOntime.classList.toggle('active', currentFilter === 'no_prazo' || currentFilter === 'foco');
      if (kpiOpenlate) kpiOpenlate.classList.toggle('active', currentFilter === 'atrasadas_abertas');
    }

    function setFilter(f) {
      currentFilter = f;
      syncActiveStates();
      switchTab('radar');
      renderTasks();
    }

    function clearSearch() {
      const inp = document.getElementById('search-input');
      if (inp) inp.value = '';
      renderTasks();
    }

    function filterByCourse(courseCode) {
      const course = DATA.cursos.find(c => c.codigo === courseCode || c.id === courseCode);
      if (!course) return;
      const inp = document.getElementById('search-input');
      if (inp) inp.value = course.fullname;
      currentFilter = 'todas_pendentes';
      syncActiveStates();
      switchTab('radar');
      renderTasks();
    }

    function toggleIntro(id) {
      const el = document.getElementById('intro-' + id);
      if (!el) return;
      const isOpen = el.classList.toggle('open');
      const btn = document.getElementById('btn-intro-' + id);
      if (btn && btn.dataset.labelOpen && btn.dataset.labelClosed) {
        btn.textContent = isOpen ? btn.dataset.labelOpen : btn.dataset.labelClosed;
      }
    }

    function handleCardClick(e, id) {
      if (e.target.closest('a, button, .intro-box')) return;
      toggleIntro(id);
    }

    function renderTasks() {
      const inp = document.getElementById('search-input');
      const rawQ = inp ? inp.value : '';
      const q = (rawQ || '').toLowerCase().trim();
      const clearBtn = document.getElementById('clear-search-btn');
      if (clearBtn) clearBtn.classList.toggle('visible', q.length > 0);

      const list = document.getElementById('radar-list');
      const enriched = DATA.todas_tarefas
        .filter(t => !t.entregue)
        .map(t => ({ ...t, _live: calcLiveStatus(t) }));

      const filtered = enriched.filter(t => {
        if (q) {
          const hay = `${t.nome} ${t.curso_nome} ${t.assign_id}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        const cat = t._live.category;
        if (currentFilter === 'foco') {
          return cat === 'urgente' || cat === 'semana' || cat === 'no_prazo';
        } else if (currentFilter === 'urgentes_7d') {
          return cat === 'urgente' || cat === 'semana';
        } else if (currentFilter === 'no_prazo') {
          return cat === 'no_prazo';
        } else if (currentFilter === 'atrasadas_abertas') {
          return cat === 'atrasada_aberta';
        } else if (currentFilter === 'sem_prazo') {
          return cat === 'sem_prazo';
        }
        return true;
      });

      filtered.sort((a, b) => {
        const da = a.duedate > 0 ? a.duedate : 9999999999;
        const db = b.duedate > 0 ? b.duedate : 9999999999;
        return da - db;
      });

      const countEl = document.getElementById('results-count');
      if (countEl) {
        countEl.textContent = `Exibindo ${filtered.length} atividade(s)` + (q ? ` para "${rawQ.trim()}"` : '');
      }

      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state">🎉 Nenhuma atividade pendente encontrada neste filtro!</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => {
        const st = t._live;
        const introText = t.intro || 'Atividade acadêmica regular da UNIP.';
        return `
          <div class="card card-${st.cls} clickable-card" data-assign-id="${t.assign_id}" onclick="handleCardClick(event, '${t.assign_id}')">
            <div class="card-top">
              <span class="badge badge-${st.cls}">${escapeHtml(st.label)}</span>
              <span class="assign-id">ID: ${escapeHtml(t.assign_id)}</span>
            </div>
            <div class="course-tag">${escapeHtml(t.curso_nome)}</div>
            <div class="task-title">${escapeHtml(t.nome)}</div>
            <div class="meta-row">
              <span>📅 Prazo: <strong>${escapeHtml(t.duedate_fmt)}</strong></span>
              <span>${t.canedit !== false ? '🔓 Envio aberto' : '🔒 Envio bloqueado'}</span>
            </div>
            <div class="actions-row">
              <a class="btn btn-primary" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">Abrir no Portal/AVA ↗</a>
              <button type="button" class="btn btn-intro-toggle" id="btn-intro-${t.assign_id}" data-label-closed="📄 Ver Instruções" data-label-open="🔼 Ocultar Instruções" onclick="toggleIntro('${t.assign_id}')">📄 Ver Instruções</button>
            </div>
            <div class="intro-box" id="intro-${t.assign_id}">
              ${escapeHtml(introText)}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCursos() {
      const container = document.getElementById('cursos-list');
      container.innerHTML = DATA.cursos.map(c => {
        const pdfList = (c.pdfs || []).map(p => `• 📄 <a href="${escapeHtml(p.url)}" target="_blank" style="color:var(--accent);text-decoration:none">${escapeHtml(p.filename)}</a> <span style="color:var(--muted)">(${escapeHtml(p.secao)})</span>`).join('\n');
        const courseTasks = DATA.todas_tarefas.filter(t => t.curso_id === c.id || t.curso_id === c.codigo);
        const taskListHtml = courseTasks.map(t => {
          const st = calcLiveStatus(t);
          return `• <strong>${escapeHtml(t.nome)}</strong> — <span style="color:var(--accent)">${escapeHtml(st.label)}</span> (${escapeHtml(t.duedate_fmt)})`;
        }).join('\n');

        return `
          <div class="card" data-course-id="${c.id}">
            <div class="card-top">
              <span class="course-tag">Cód: ${escapeHtml(c.codigo)}</span>
              <span class="assign-id">${c.presencas ? c.presencas.length + ' presenças' : ''}</span>
            </div>
            <div class="task-title">${escapeHtml(c.fullname)}</div>
            <div class="meta-row">
              <span>📝 ${c.tarefas_count} tarefas/questionários</span>
              <span>📄 ${c.pdfs_count} apostilas/PDFs</span>
            </div>
            <div class="actions-row">
              ${c.pdfs_count > 0 ? `<button type="button" class="btn btn-pdfs-toggle" id="btn-intro-curso-${c.id}" data-label-closed="📂 Ver ${c.pdfs_count} Apostilas/PDFs" data-label-open="🔼 Ocultar PDFs" onclick="toggleIntro('curso-${c.id}')">📂 Ver ${c.pdfs_count} Apostilas/PDFs</button>` : ''}
              ${c.tarefas_count > 0 ? `<button type="button" class="btn btn-tasks-toggle" id="btn-intro-curso-tasks-${c.id}" data-label-closed="📝 Ver ${c.tarefas_count} Atividades" data-label-open="🔼 Ocultar Atividades" onclick="toggleIntro('curso-tasks-${c.id}')">📝 Ver ${c.tarefas_count} Atividades</button>` : ''}
              ${c.tarefas_count > 0 ? `<button type="button" class="btn btn-primary btn-filter-course" onclick="filterByCourse('${c.codigo}')">🚨 Filtrar no Radar</button>` : ''}
            </div>
            ${c.pdfs_count > 0 ? `<div class="intro-box" id="intro-curso-${c.id}">${pdfList}</div>` : ''}
            ${c.tarefas_count > 0 ? `<div class="intro-box" id="intro-curso-tasks-${c.id}">${taskListHtml}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderNotas() {
      const container = document.getElementById('notas-list');
      container.innerHTML = DATA.cursos.map(c => {
        const pres = c.presencas || [];
        const trab = c.notas_trabalhos || [];
        if (!pres.length && !trab.length) {
          return `
            <div class="card">
              <div class="course-tag">Cód: ${escapeHtml(c.codigo)}</div>
              <div class="task-title">${escapeHtml(c.fullname)}</div>
              <div class="empty-state" style="padding:16px 0">Sem notas ou registros de frequência até o momento.</div>
            </div>
          `;
        }

        return `
          <div class="card">
            <div class="course-tag">Cód: ${escapeHtml(c.codigo)}</div>
            <div class="task-title">${escapeHtml(c.fullname)}</div>

            ${trab.length ? `
              <div style="font-size:12px;font-weight:700;color:var(--accent);margin-top:8px">📝 Trabalhos & Notas:</div>
              <table class="grade-table">
                <thead><tr><th>Trabalho</th><th style="text-align:center">Situação / Nota</th></tr></thead>
                <tbody>
                  ${trab.map(t => `<tr><td>${escapeHtml(t.trabalho)}</td><td class="grade-val">${escapeHtml(t.nota)}</td></tr>`).join('')}
                </tbody>
              </table>
            ` : ''}

            ${pres.length ? `
              <div style="font-size:12px;font-weight:700;color:#34d399;margin-top:12px">📅 Presenças em Aulas Práticas (${pres.length} aulas):</div>
              <table class="grade-table">
                <thead><tr><th>Data da Aula</th><th style="text-align:center">Turno</th><th style="text-align:center">Presença</th></tr></thead>
                <tbody>
                  ${pres.map(p => `<tr><td>${escapeHtml(p.data)}</td><td style="text-align:center;color:var(--muted)">${escapeHtml(p.periodo)}</td><td style="text-align:center;color:#34d399">✅ Presente</td></tr>`).join('')}
                </tbody>
              </table>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderEntregues() {
      const container = document.getElementById('entregues-list');
      const entregues = DATA.todas_tarefas
        .filter(t => t.entregue)
        .sort((a, b) => (b.duedate || 0) - (a.duedate || 0));

      if (!entregues.length) {
        container.innerHTML = `<div class="empty-state">Nenhuma tarefa marcada como concluída ainda.</div>`;
        return;
      }

      container.innerHTML = entregues.map(t => {
        const introText = t.intro || 'Atividade acadêmica regular da UNIP.';
        return `
          <div class="card card-ok clickable-card" onclick="handleCardClick(event, 'done-${t.assign_id}')">
            <div class="card-top">
              <span class="badge badge-ok">✅ Entregue • ${escapeHtml(t.status_avaliacao || 'Concluído')}</span>
              <span class="assign-id">ID: ${escapeHtml(t.assign_id)}</span>
            </div>
            <div class="course-tag">${escapeHtml(t.curso_nome)}</div>
            <div class="task-title">${escapeHtml(t.nome)}</div>
            <div class="meta-row">
              <span>📅 Prazo: ${escapeHtml(t.duedate_fmt)}</span>
              <span>${escapeHtml(t.status_envio_raw || 'Concluído')}</span>
            </div>
            <div class="actions-row">
              <a class="btn btn-primary" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">Abrir no Portal/AVA ↗</a>
              <button type="button" class="btn btn-intro-toggle" id="btn-intro-done-${t.assign_id}" data-label-closed="📄 Ver Instruções" data-label-open="🔼 Ocultar Instruções" onclick="toggleIntro('done-${t.assign_id}')">📄 Ver Instruções</button>
            </div>
            <div class="intro-box" id="intro-done-${t.assign_id}">
              ${escapeHtml(introText)}
            </div>
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const panel = document.getElementById('tab-' + tab);
      if (panel) panel.classList.add('active');
      const btn = document.querySelector(`.nav-btn[data-tab="${tab}"]`);
      if (btn) btn.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    updateKPIs();
    syncActiveStates();
    renderTasks();
    renderCursos();
    renderNotas();
    renderEntregues();
    setInterval(() => { updateKPIs(); renderTasks(); }, 60000);
  </script>
</body>
</html>
